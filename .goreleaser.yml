version: 2

project_name: grokipedia

before:
  hooks:
    - go mod tidy

builds:
  - id: grokipedia
    main: ./main.go
    binary: grokipedia
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/dl-alexandre/cli-tools/version.Version={{.Version}}
      - -X github.com/dl-alexandre/cli-tools/version.GitCommit={{.Commit}}
      - -X github.com/dl-alexandre/cli-tools/version.BuildTime={{.Date}}

archives:
  - id: default
    format: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: 'checksums.txt'
  algorithm: blake3

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - Merge pull request
      - Merge branch
  groups:
    - title: Features
      regexp: "^.*feat[(\\w)]*:*.*$"
      order: 0
    - title: Bug Fixes
      regexp: "^.*fix[(\\w)]*:*.*$"
      order: 1
    - title: Security
      regexp: "^.*sec[(\\w)]*:*.*$"
      order: 2
    - title: Other
      order: 999

release:
  github:
    owner: dl-alexandre
    name: Grokipedia-CLI
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
  header: |
    ## What's Changed

  footer: |
    ## Installation

    ### Homebrew
    ```bash
    brew tap dl-alexandre/tap
    brew install grokipedia
    ```

    ### Go Install
    ```bash
    go install github.com/grokipedia/cli@v{{.Version}}
    ```

    ### Download Binary
    Download the appropriate binary for your platform from the assets below.

    ---
    **Full Changelog**: https://github.com/dl-alexandre/Grokipedia-CLI/compare/{{ .PreviousTag }}...{{ .Tag }}

brews:
  - name: grokipedia
    repository:
      owner: dl-alexandre
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
      branch: master
      pull_request:
        enabled: false
    commit_author:
      name: goreleaserbot
      email: bot@dl-alexandre.com
    commit_msg_template: "Brew formula update for {{ .ProjectName }} version {{ .Tag }}"
    directory: Formula
    homepage: "https://github.com/dl-alexandre/Grokipedia-CLI"
    description: "Grokipedia CLI - command-line interface for the Grokipedia API"
    license: "MIT"
    skip_upload: "{{ if index .Env \"HOMEBREW_TAP_TOKEN\" }}false{{ else }}true{{ end }}"
    test: |
      system "#{bin}/grokipedia", "--help"
    install: |
      bin.install "grokipedia"

flatpak:
  - app_id: net.ddns.dl-alexandre.GrokipediaCLI
    runtime: org.freedesktop.Platform
    runtime_version: "24.08"
    sdk: org.freedesktop.Sdk
    finish_args:
      - --share=network
      - --filesystem=home

srpm:
  enabled: true
  summary: "Grokipedia CLI - command-line interface for the Grokipedia API"
  license: MIT
  url: https://github.com/dl-alexandre/Grokipedia-CLI

scoops:
  - repository:
      owner: dl-alexandre
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
      branch: main
      pull_request:
        enabled: false
    commit_author:
      name: goreleaserbot
      email: bot@dl-alexandre.com
    commit_msg_template: "Scoop update for {{ .ProjectName }} version {{ .Tag }}"
    directory: bucket
    description: "CLI for Wikipedia/Grok integration"
    homepage: "https://github.com/dl-alexandre/Grokipedia-CLI"
    license: MIT
    skip_upload: "{{ if index .Env \"SCOOP_BUCKET_TOKEN\" }}false{{ else }}true{{ end }}"
