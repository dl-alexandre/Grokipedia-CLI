name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release'
        required: true
        type: string

concurrency:
  group: release-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
        exclude:
          - os: windows
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows" ]; then
            go build -trimpath -ldflags="-s -w" -o "dist/grokipedia.exe" ./main.go
          else
            go build -trimpath -ldflags="-s -w" -o "dist/grokipedia" ./main.go
          fi

      - name: Package
        run: |
          if [ "${{ matrix.os }}" = "windows" ]; then
            zip -j "dist/grokipedia-${{ matrix.os }}-${{ matrix.arch }}.zip" "dist/grokipedia.exe"
            rm dist/grokipedia.exe
          else
            tar -czf "dist/grokipedia-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" -C dist grokipedia
            rm dist/grokipedia
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: grokipedia-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if release already published
        id: published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COUNT=$(gh release view "${{ steps.tag.outputs.name }}" \
            --json assets -q '.assets | length' 2>/dev/null || echo 0)
          echo "asset_count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -ge 6 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release already published
        if: steps.published.outputs.skip == 'true'
        run: |
          echo "Release ${{ steps.tag.outputs.name }} already has ${{ steps.published.outputs.asset_count }} assets — skipping publish"

      - name: Download all artifacts
        if: steps.published.outputs.skip != 'true'
        uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: grokipedia-*
          merge-multiple: true

      - name: Checksums
        if: steps.published.outputs.skip != 'true'
        run: |
          cd dist
          sha256sum grokipedia-* > checksums.txt

      - name: Release
        if: steps.published.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: dist/*