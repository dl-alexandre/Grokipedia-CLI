name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release'
        required: true
        type: string

concurrency:
  group: release-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run tests
        run: |
          go vet ./...
          go test -race ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
        exclude:
          - os: windows
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          mkdir -p dist
          version="v${RELEASE_TAG#v}"
          commit="$(git rev-parse --short=12 HEAD)"
          build_time="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          ldflags="-s -w -X main.version=${version} -X main.gitCommit=${commit} -X main.buildTime=${build_time}"
          if [ "${{ matrix.os }}" = "windows" ]; then
            go build -trimpath -ldflags="$ldflags" -o "dist/grokipedia.exe" ./cmd/grokipedia
          else
            go build -trimpath -ldflags="$ldflags" -o "dist/grokipedia" ./cmd/grokipedia
          fi

      - name: Verify build metadata
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          version="v${RELEASE_TAG#v}"
          output="$(./dist/grokipedia version)"
          printf '%s\n' "$output"
          grep -F "grokipedia ${version} " <<< "$output"

      - name: Package
        run: |
          if [ "${{ matrix.os }}" = "windows" ]; then
            zip -j "dist/grokipedia-${{ matrix.os }}-${{ matrix.arch }}.zip" "dist/grokipedia.exe"
            rm dist/grokipedia.exe
          else
            tar -czf "dist/grokipedia-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" -C dist grokipedia
            rm dist/grokipedia
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: grokipedia-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          retention-days: 1

  release:
    needs: build
    outputs:
      tag: ${{ steps.tag.outputs.name }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if release already published
        id: published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COUNT=$(gh release view "${{ steps.tag.outputs.name }}" \
            --json assets -q '.assets | length' 2>/dev/null || echo 0)
          echo "asset_count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -ge 6 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release already published
        if: steps.published.outputs.skip == 'true'
        run: |
          echo "Release ${{ steps.tag.outputs.name }} already has ${{ steps.published.outputs.asset_count }} assets — skipping publish"

      - name: Download all artifacts
        if: steps.published.outputs.skip != 'true'
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: grokipedia-*
          merge-multiple: true

      - name: Checksums
        if: steps.published.outputs.skip != 'true'
        run: |
          cd dist
          sha256sum grokipedia-* > checksums.txt

      - name: Release
        if: steps.published.outputs.skip != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: dist/*

  update-packages:
    needs: release
    if: ${{ needs.release.outputs.tag != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Checkout Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: dl-alexandre/homebrew-tap
          ref: master
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: package/homebrew

      - name: Checkout Scoop bucket
        uses: actions/checkout@v7
        with:
          repository: dl-alexandre/scoop-bucket
          ref: main
          token: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          path: package/scoop

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          mkdir -p release-assets
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'checksums.txt' \
            --dir release-assets
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'grokipedia-*' \
            --dir release-assets

      - name: Update package metadata
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          ./scripts/update-release-packages.sh \
            "$RELEASE_TAG" \
            "$GITHUB_WORKSPACE/release-assets" \
            "$GITHUB_WORKSPACE/package/homebrew" \
            "$GITHUB_WORKSPACE/package/scoop"

      - name: Commit Homebrew formula
        working-directory: package/homebrew
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/grokipedia.rb
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Homebrew formula is already current"
          else
            git commit -m "Brew formula update for grokipedia version ${{ needs.release.outputs.tag }}"
            git push origin HEAD:master
          fi

      - name: Commit Scoop manifest
        working-directory: package/scoop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/grokipedia.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Scoop manifest is already current"
          else
            git commit -m "Scoop update for grokipedia version ${{ needs.release.outputs.tag }}"
            git push origin HEAD:main

          fi